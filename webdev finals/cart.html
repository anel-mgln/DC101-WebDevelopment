<body>
    <!--Navbar-->
    <header>
        <!--Menu-Icon-->
        <i class='bx bx-menu' id="menu-icon"></i>
        <!--Links-->
        <h1 style=" position: fixed;width: 100%; top: 0; right: 0;z-index: 1000;display: flex;justify-content: space-between;align-items: center;padding: 18px 100px;transition: 0.5s linear;background: var(--text-color);box-shadow: var(--box-shadow);">

     <input type="search" name="" id="" placeholder="Search Here...">
